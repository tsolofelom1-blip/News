<script>
let cat = "top news";
let country = "ZA:en";

async function fetchNews(){
  const feed = document.getElementById('feed');
  feed.innerHTML = `<div class="live">🔴 LIVE • ${cat} • ${new Date().toLocaleTimeString()}</div>`;
  
  // 3 ways to get news, if one fails try next
  const rss = `https://news.google.com/rss/search?q=${encodeURIComponent(cat)}&hl=en-US&gl=US&ceid=US:en`;
  
  const sources = [
    `https://api.allorigins.win/get?url=${encodeURIComponent(rss)}`,
    `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rss)}`
  ];

  for(let url of sources){
    try{
      let res = await fetch(url);
      let data = await res.json();
      let text = data.contents || JSON.stringify(data);
      // If rss2json format
      if(data.items && data.items.length){
        show(data.items);
        return;
      }
      // If allorigins XML format
      if(text.includes('<item>')){
        let items = [...text.matchAll(/<item>[\s\S]*?<title><!\[CDATA\[(.*?)\]\]><\/title>[\s\S]*?<link>(.*?)<\/link>/g)].slice(0,15);
        if(items.length){
          let parsed = items.map(m=>({title:m[1], link:m[2]}));
          show(parsed);
          return;
        }
      }
    }catch(e){ console.log("try next", e) }
  }
  // FINAL FALLBACK - so it never stays loading
  show([
    {title: `Live ${cat} news - Google News is rate limiting, but your site design works! Click to test`, link:"https://news.google.com"},
    {title: "South Africa business news update", link:"https://news.google.com"},
    {title: "World technology news - AI update", link:"https://news.google.com"},
    {title: "Sports: Springboks latest", link:"https://news.google.com"}
  ]);
}

function show(items){
  const feed = document.getElementById('feed');
  items.forEach(i=>{
    let d = document.createElement('div');
    d.className='card';
    d.innerHTML = `<img src="https://picsum.photos/seed/${Math.random()}/110/75"><div><h3>${i.title}</h3><div class="meta">Google News • Worldwide • Click to read</div></div>`;
    d.onclick = ()=> window.open(i.link,'_blank');
    feed.appendChild(d);
  });
}
        </script>
