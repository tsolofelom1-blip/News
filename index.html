<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World News Live - Fixed</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
  body{background:#f1f3f4}
  header{background:#fff;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;border-bottom:1px solid #ddd;z-index:100}
  .logo{font-weight:800;font-size:18px} 
  .logo span{color:#1a73e8}
  .nav{background:#fff;padding:10px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid #ddd}
  .nav button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;white-space:nowrap}
  .nav button.active{background:#1a73e8;color:#fff}
  #feed{max-width:750px;margin:12px auto;padding:0 10px;display:flex;flex-direction:column;gap:10px}
  .card{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;border:1px solid #e0e0e0;text-decoration:none;color:inherit;transition:box-shadow 0.2s}
  .card:hover{box-shadow:0 2px 6px rgba(0,0,0,0.1)}
  .card h3{font-size:15px;color:#202124;line-height:1.4}
  .meta{font-size:12px;color:#666;display:flex;justify-content:space-between}
  .live{color:#d93025;font-weight:700;font-size:12px;text-align:center;padding:6px;background:#fff;border-radius:8px;border:1px solid #e0e0e0}
</style>
</head>
<body>

<header>
  <div class="logo">World <span>News</span> Live</div>
  <div id="clock" style="font-size:11px;margin-left:auto"></div>
</header>

<div class="nav">
  <button class="active" onclick="setCat('search',this)">Top Stories</button>
  <button onclick="setCat('world',this)">World</button>
  <button onclick="setCat('business',this)">Business</button>
  <button onclick="setCat('technology',this)">Technology</button>
  <button onclick="setCat('sport',this)">Sports</button>
</div>

<div id="feed">
  <div class="live">🔴 LIVE • Auto-updating every 3 mins</div>
  <div id="status" class="live">Loading real-time news...</div>
</div>

<script>
let currentCat = 'search';

function setCat(c, btn) {
  currentCat = c;
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadNews();
}

async function loadNews() {
  const feedDiv = document.getElementById('feed');
  
  // Directly targeting the Guardian's free open-tier API which bypasses browser CORS limits smoothly
  const apiUrl = `https://guardianapis.com{currentCat}?api-key=test&page-size=15`;

  try {
    let res = await fetch(apiUrl);
    if (!res.ok) throw new Error("Fetch failed");
    let data = await res.json();
    let articles = data.response.results;
    
    feedDiv.innerHTML = `<div class="live">🔴 LIVE • ${currentCat.toUpperCase()} • ${new Date().toLocaleTimeString()}</div>`;

    if (!articles || articles.length === 0) {
      feedDiv.innerHTML += `<div class="card"><h3>No live updates found. Try another category tab.</h3></div>`;
      return;
    }

    articles.forEach((item) => {
      let title = item.webTitle || "No title available";
      let link = item.webUrl || "#";
      let section = item.sectionName || "Global News";
      
      let card = document.createElement('a');
      card.className = 'card';
      card.href = link;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <h3>${title}</h3>
        <div class="meta">
          <span>Category: ${section}</span>
          <span>Tap to read</span>
        </div>
      `;
      feedDiv.appendChild(card);
    });

  } catch (err) {
    feedDiv.innerHTML = `
      <div class="live">⚠️ Connection error. Click below to refresh.</div>
      <div class="card" onclick="loadNews()"><h3>Tap here to retry connection</h3></div>
    `;
  }

  document.getElementById('clock').innerText = new Date().toLocaleTimeString();
}

loadNews();
setInterval(loadNews, 180000);
</script>

</body>
</html>
